name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # M1 replaces this with pnpm install, pnpm check, pnpm build, and pnpm audit.
      - run: node tools/check-docs.ts
